<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <divHello World</div>
    <div>Hello World 2</div>
    <div>Hello World 3</div>

    <hr>

    <span>h1</span>
    <span>h2</span>
    <span>h3</span>

    <aside>asds</aside>
    
    <section>
        <div>
            <label for="name">Your Name</label>
            <input type="text" name="name" id="name">

        </div>
    </section>

    <fieldset>
        <legend align="center">Basic Form</legend>
    <div>


    <div><label  for="fullName">Full Name :</label>
    <input type="text" name="fullName" id="fullName" placeholder="Enter your Name">
</div>
    <br>
    <br>

   <div> <label for="email">Email :</label>
    <input type="text" name="email" id="email" placeholder="Enter your Email"></div>

    <br><br>

    <div><label for="password">Password :</label>
    <input type="password"
    name="password"
    id="password"
    placeholder="Your Password"></div>
    <br><br>

    <div><label for="cfpassword">Confirm Password :</label>
    <input type="cfpassword"
    name="cfpassword"
    id="cfpassword"
    placeholder="Confirm Your Password">
</div>
    <br><br>

    <div><label for="dob">Date Of Birth :</label>
    <input type="date" name="dob" id="dob">
    </div>
    <br><br>

    <div>
    <label for="tob">Time Of Birth :</label>
    <input type="time" name="tob" id="tob"></div>


    <br><br>
    <div><label for="joiningTime">Joining Time :</label>
    <input type="datetime-local"
    name="joiningTime"
    id="joiningTime">
</div>
    <br><br>

    <div><label for="volume">Volume :</label>
    <input type="range"
    name="volume"
    id="volume"
    min="0"
    max="10"
    value="3">
</div>
    <br><br>

     <div><label for="mobile">Mobile :</label>
    <input type="number"
    name="number"
    id="number"
    ></div>
    <br><br>

   <div> <label for="resume">Resume :</label>
    <input type="file" name="resume" id="resume">
</div>
    <br><br>
<div>
    <label for="address">Address :</label>
    <textarea name="address" id="address"></textarea>
    
</div>

<br><br>
    <div><label for="course">Course :</label>
    <select name="course" id="course">
        <option value="">--Select Course--</option>
        <option value="btech">B Tech</option>
        <option value="bba">BBA</option>
        <option value="mtech">M Tech</option>
        <option value="mba">MMBA</option>
    </select></div>
    <br><br>


    <div><label for="gender">Gender :</label>
    <input type="radio" name="gender" id="male" value="male">
    <span>Male</span>
    <input type="radio" name="gender" id="female" value="female">
    <span>Female</span>
    <input type="radio" name="gender" id="male" value="male">
    <span>Others</span></div>
    <br><br>

    <div> <label for="skillset">Skillset :</label>
    <input type="checkbox" name="skillset" id="html" value="html">
    <span>HTML</span>
    <input type="checkbox" name="skillset" id="DSA" value="DSA">
    <span>DSA</span>
    <input type="checkbox" name="skillset" id="AI" value="AI">
    <span>AI</span></div>
    <br><br>

    <img src="lenovo.jpg" alt="Lenovo Image"
    width="200"
    height="150">




    <button>Submit</button>
    </div>
    


    </fieldset>
    
     <a href="../index.html">Back To Home</a>
    
</body>
</html>
