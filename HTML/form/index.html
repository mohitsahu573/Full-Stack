<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <fieldset>
        <legend align="center">Basic Form</legend>
    <form>


    <label  for="fullName">Full Name :</label>
    <input type="text" name="fullName" id="fullName" placeholder="Enter your Name">

    <br>
    <br>

    <label for="email">Email :</label>
    <input type="text" name="email" id="email" placeholder="Enter your Email">

    <br><br>

    <label for="password">Password :</label>
    <input type="password"
    name="password"
    id="password"
    placeholder="Your Password">
    <br><br>

    <label for="cfpassword">Confirm Password :</label>
    <input type="cfpassword"
    name="cfpassword"
    id="cfpassword"
    placeholder="Confirm Your Password">

    <br><br>

    <label for="dob">Date Of Birth :</label>
    <input type="date" name="dob" id="dob">
    <br><br>

    <label for="tob">Time Of Birth :</label>
    <input type="time" name="tob" id="tob">


    <br><br>
    <label for="joiningTime">Joining Time :</label>
    <input type="datetime-local"
    name="joiningTime"
    id="joiningTime">

    <br><br>

    <label for="volume">Volume :</label>
    <input type="range"
    name="volume"
    id="volume"
    min="0"
    max="10"
    value="3">

    <br><br>

     <label for="mobile">Mobile :</label>
    <input type="number"
    name="number"
    id="number"
    >
    <br><br>

    <label for="resume">Resume :</label>
    <input type="file" name="resume" id="resume">

    <br><br>

    <label for="address">Address :</label>
    <textarea name="address" id="address"></textarea>
    <br><br>

    <label for="course">Course :</label>
    <select name="course" id="course">
        <option value="">--Select Course--</option>
        <option value="btech">B Tech</option>
        <option value="bba">BBA</option>
        <option value="mtech">M Tech</option>
        <option value="mba">MMBA</option>
    </select>
    <br><br>


    <label for="gender">Gender :</label>
    <input type="radio" name="gender" id="male" value="male">
    <span>Male</span>
    <input type="radio" name="gender" id="female" value="female">
    <span>Female</span>
    <input type="radio" name="gender" id="male" value="male">
    <span>Other</span>
    <br><br>

     <label for="skillset">Skillset :</label>
    <input type="checkbox" name="skillset" id="html" value="html">
    <span>HTML</span>
    <input type="checkbox" name="skillset" id="DSA" value="DSA">
    <span>DSA</span>
    <input type="checkbox" name="skillset" id="AI" value="AI">
    <span>AI</span>
    <br><br>

    <img src="lenovo.jpg" alt="Lenovo Image"
    width="200"
    height="150">




    <button>Submit</button>
    
    </form>

    </fieldset>
    
</body>
</html>
